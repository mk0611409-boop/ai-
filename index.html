<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 VANTA AI | مركز القيادة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #05020a; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .glass { background: rgba(20, 10, 35, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(139, 92, 246, 0.3); }
        .chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg-user { align-self: flex-end; background: rgba(139, 92, 246, 0.2); border-right: 3px solid #8b5cf6; padding: 10px; border-radius: 8px; max-width: 85%; }
        .msg-ai { align-self: flex-start; background: rgba(255, 255, 255, 0.05); border-left: 3px solid #fbbf24; padding: 10px; border-radius: 8px; max-width: 85%; }
        .tabs button { flex: 1; padding: 10px; background: transparent; border: none; color: gray; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .tabs button.active { color: #fbbf24; border-bottom: 3px solid #fbbf24; }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header class="glass p-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <span class="text-2xl">👑</span>
            <h1 class="font-bold text-xl text-[#fbbf24]">VANTA AI</h1>
        </div>
        <button onclick="openSettings()" class="text-gray-400 hover:text-white">⚙️ الإعدادات</button>
    </header>

    <!-- التبويبات (نص - صورة - فيديو) -->
    <div class="tabs flex border-b border-gray-800">
        <button class="active" onclick="switchTab('text', this)">💬 دردشة</button>
        <button onclick="switchTab('image', this)">🎨 توليد صور</button>
        <button onclick="switchTab('video', this)">🎬 فيديو</button>
    </div>

    <!-- منطقة الشات -->
    <div class="chat-box" id="chat-box">
        <div class="msg-ai">أهلاً بك يا ملك. أنا VANTA AI. ماذا نصنع اليوم؟</div>
    </div>

    <!-- مدخلات المستخدم -->
    <div class="glass p-4 flex gap-2">
        <input type="text" id="user-input" placeholder="اكتب طلبك هنا..." class="flex-1 bg-black/50 border border-gray-600 rounded-lg p-3 text-white outline-none focus:border-[#8b5cf6]">
        <button onclick="handleSend()" class="bg-[#8b5cf6] hover:bg-purple-600 px-6 rounded-lg font-bold transition">إرسال</button>
    </div>

    <!-- نافذة الإعدادات (للمفاتيح) -->
    <div id="settings-modal" class="fixed inset-0 bg-black/90 hidden justify-center items-center z-50 p-4">
        <div class="glass p-6 rounded-xl w-full max-w-md">
            <h2 class="text-xl font-bold text-[#fbbf24] mb-4">إعدادات VANTA AI</h2>
            
            <label class="block text-sm text-gray-400 mb-1">مفتاح OpenRouter (للنصوص):</label>
            <input type="password" id="key-text" class="w-full bg-black border border-gray-600 rounded p-2 mb-4 text-white text-sm" placeholder="sk-or-...">
            
            <p class="text-xs text-gray-500 mb-4">* الصور تُولد مجاناً عبر سيرفر Pollinations (لا تحتاج مفتاح).</p>
            <p class="text-xs text-gray-500 mb-4">* الفيديوهات: سيتم توليد صورة سينمائية + رابط بحث.</p>

            <div class="flex gap-2">
                <button onclick="saveKeys()" class="flex-1 bg-[#10b981] text-white py-2 rounded font-bold">حفظ</button>
                <button onclick="closeSettings()" class="flex-1 bg-gray-700 text-white py-2 rounded font-bold">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'text';
        let apiKey = localStorage.getItem('vanta_key') || '';

        function switchTab(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const input = document.getElementById('user-input');
            if(mode === 'text') input.placeholder = "اكتب سؤالك أو طلبك...";
            if(mode === 'image') input.placeholder = "صف الصورة التي تريدها... (مثال: Gojo with a crown)";
            if(mode === 'video') input.placeholder = "صف الفيديو الذي تتخيله...";
        }

        function openSettings() {
            document.getElementById('key-text').value = apiKey;
            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('settings-modal').classList.add('flex');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
            document.getElementById('settings-modal').classList.remove('flex');
        }

        function saveKeys() {
            apiKey = document.getElementById('key-text').value.trim();
            localStorage.setItem('vanta_key', apiKey);
            closeSettings();
            alert("تم الحفظ!");
        }

        async function handleSend() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if(!text) return;

            addMessage('user', text);
            input.value = '';

            if(currentMode === 'text') {
                await handleTextAI(text);
            } else if(currentMode === 'image') {
                await handleImageGen(text);
            } else if(currentMode === 'video') {
                await handleVideoGen(text);
            }
        }

        function addMessage(sender, text, isHTML = false) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = sender === 'user' ? 'msg-user' : 'msg-ai';
            if(isHTML) div.innerHTML = text; else div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // 1. محرك النصوص (OpenRouter)
        async function handleTextAI(prompt) {
            if(!apiKey) {
                addMessage('ai', "⚠️ الرجاء إدخال مفتاح OpenRouter من الإعدادات أولاً.");
                return;
            }
            addMessage('ai', "جاري التفكير...");
            const loading = document.getElementById('chat-box').lastChild;

            try {
                const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
                    body: JSON.stringify({
                        model: "openrouter/free",
                        messages: [
                            { role: "system", content: "أنت VANTA، كيان ذكاء اصطناعي خارق، خبير في البرمجة والهاكر. أجب بثقة وقوة بالعربية." },
                            { role: "user", content: prompt }
                        ]
                    })
                });
                const data = await res.json();
                loading.innerText = data.choices[0].message.content;
            } catch (e) {
                loading.innerText = "خطأ: تأكد من المفتاح والاتصال.";
            }
        }

        // 2. محرك الصور (Pollinations AI - مجاني)
        function handleImageGen(prompt) {
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&nologo=true`;
            addMessage('ai', `<img src="${imageUrl}" class="rounded-lg mt-2 w-full" alt="${prompt}">`, true);
        }

        // 3. محرك الفيديو (محاكاة: صورة سينمائية + رابط)
        function handleVideoGen(prompt) {
            const imageUrl = `https://image.pollinations.ai/prompt/cinematic+shot+of+${encodeURIComponent(prompt)}?width=1024&height=576&nologo=true`;
            const searchUrl = `https://www.google.com/search?q=${encodeURIComponent('AI generated video ' + prompt)}`;
            
            const html = `
                <div class="text-sm mb-2">تم توليد مشهد سينمائي لطلبك:</div>
                <img src="${imageUrl}" class="rounded-lg w-full mb-3" alt="${prompt}">
                <a href="${searchUrl}" target="_blank" class="bg-[#fbbf24] text-black px-4 py-2 rounded text-xs font-bold inline-block">🔗 مشاهدة فيديوهات مشابهة</a>
            `;
            addMessage('ai', html, true);
        }

        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') handleSend();
        });
    </script>
</body>
  </html>
